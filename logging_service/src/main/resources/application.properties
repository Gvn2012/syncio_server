spring.application.name=logging-service
server.port=8094

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb+srv://vietp6861_db_user:OxvEjMko11affa2A@syncio-clt.fgkymji.mongodb.net/?appName=syncio-clt}
spring.data.mongodb.database=logging_service

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=logging-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.properties.spring.json.trusted.packages=io.github.gvn2012.shared.kafka_events
spring.kafka.properties.spring.json.value.default.type=io.github.gvn2012.shared.kafka_events.CentralizedLogEvent

# Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://syncio-zipkin:9411/api/v2/spans}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true

syncio.logging.archive.enabled=${SYNCIO_LOG_ARCHIVE_ENABLED:true}
syncio.logging.archive.retention-days=${SYNCIO_LOG_ARCHIVE_RETENTION_DAYS:30}
syncio.logging.archive.batch-size=${SYNCIO_LOG_ARCHIVE_BATCH_SIZE:500}
syncio.logging.archive.directory=${SYNCIO_LOG_ARCHIVE_DIRECTORY:/var/lib/syncio/log-archive}
syncio.logging.archive.cron=${SYNCIO_LOG_ARCHIVE_CRON:0 15 2 * * *}
